name: Test Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DATABASE: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    # Python & dependency installation
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: install dependencies
      run: uv sync --locked

    - name: lint with ruff
      run: uv run ruff check --output-format=github .
# 1/30/26 this fails in CI linting against a file that should not be linted (below), no idea why
# python3.11/site-packages/jsonschema-stubs/_utils.pyi
#    - name: type check with ty
#      run: uv run ty check openstates
    - name: pytest
      run: uv run pytest --cov-report=xml --cov=openstates --ds=openstates.test_settings --reuse-db -v openstates
      env:
        DATABASE_URL: postgresql://test:test@localhost/test
