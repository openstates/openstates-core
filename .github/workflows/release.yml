name: Release Steps
on:
  push:
    tags:
      - '*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Retrieves all commit history for path filter checking
          fetch-depth: 0
      - name: install GDAL and python bindings
        run: sudo apt update && sudo apt-get install -y gdal-bin python3-gdal
      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish core package
        run: uv build && uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_KEY }}
      - name: install dependencies
        run: uv sync --locked
      - name: update metadata
        env:
          DATABASE_URL: ${{ secrets.OPENSTATES_DATABASE_URL }}
        run: uv run os-initdb
      # Check if metadata files changed since last tag
      - name: Check if metadata changed
        id: metadata_changed
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
          echo "Previous tag: $PREV_TAG"
          if git diff --name-only "$PREV_TAG" HEAD | grep -q "^openstates/metadata/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Metadata files changed - will publish openstates_metadata"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No metadata files changed - skipping openstates_metadata publish"
          fi

      # Only prepare and publish metadata when metadata files changed
      - name: Create directory and copy openstates_metadata
        if: steps.metadata_changed.outputs.changed == 'true'
        run: |
          mkdir -p core_metadata
          cp -r openstates/metadata core_metadata
      - name: Handle openstates_metadata steps
        if: steps.metadata_changed.outputs.changed == 'true'
        working-directory: ./core_metadata
        run: |
          mv metadata/pyproject.toml.sample pyproject.toml
          mv metadata/.python-version.sample .python-version
          mv metadata/README.md.sample README.md
          mv metadata openstates_metadata
          uv build
          uv publish --token "${{ secrets.OPENSTATES_METADATA_PYPI_API_KEY }}"
