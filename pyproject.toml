[project]
name = "openstates"
version = "6.26.5"
description = "core infrastructure for the openstates project"
authors = [{ name = "James Turk", email = "dev@jamesturk.net" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "psycopg2-binary>=2.8.4,<3",
    "dj_database_url>=0.5.0,<0.6",
    "Django==3.2.14",
    "scrapelib>=2.4.1,<3",
    "jsonschema>=3.2.0,<4",
    "click>=8.0,<9",
    "attrs>=20.2.0,<21",
    "PyYAML>=6.0,<7",
    "textract>=2.0,<3",
    "chardet>=7.4,<8",
    "pydantic>=1.8.2,<2",
    "spatula>=0.8.9,<1.0",
    "PyJWT>=2.5.0,<3",
    "boto3>=1.26.61,<2",
    "us>=3.1.1,<4",
    "influxdb-client>=1.37.0,<2",
    "pytz>=2024.1,<2025",
    "google-cloud-storage>=2.18.0,<3",
    "gitpython>=3.1.44,<4",
    "pytest>=6.2.5,<7",
    "six>=1.17.0,<2",
    "legacy-cgi>=2.6.4,<3",
    "urllib3>=2.7.0,<3",
]

[project.scripts]
os-update = "openstates.cli.update:main"
os-initdb = "openstates.cli.initdb:main"
os-dbmakemigrations = "openstates.cli.makemigrations:main"
os-update-computed = "openstates.cli.update_computed:main"
os-text-extract = "openstates.cli.text_extract:main"
os-people = "openstates.cli.people:main"
os-committees = "openstates.cli.committees:main"
os-us-to-yaml = "openstates.cli.convert_us:main"
os-relationships = "openstates.cli.relationships:main"
os-scrape = "openstates.cli.scrape:main"
os-validate = "openstates.cli.validate:main"
os-people-repo-update = "openstates.cli.people_repo_update:main"

[dependency-groups]
dev = [
    "pytest>=6.2.5,<7",
    "pytest-cov>=2.8.1,<3",
    "pytest-django>=3.8.0,<4",
    "coveralls>=1.11.1,<2",
    "coverage[toml]>=5.0.4,<6",
    "ruff>=0.17.3",
    "ty",
    "types-pytz>=2021.1.0",
    "types-click>=7.1.2",
    "types-PyYAML>=5.4.3",
    "types-requests>=2.28.11.5",
    "types-jsonschema>=4.17.0.3",
    "types-influxdb-client>=1.37.0.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
# match the previous flake8 setup (pycodestyle + pyflakes, no line length)
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ty.src]
exclude = [
    "openstates/data",
    "openstates/importers",
    "openstates/scrape",
    "openstates/cli/tests",
    "openstates/utils/tests",
    "openstates/models/tests",
]

[tool.coverage.run]
omit = [
  "openstates/data/admin/*",
  "openstates/utils/ansistrm.py",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
